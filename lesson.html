<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurioTech — Interactive Lesson & Quiz</title>
  <link rel="icon" href="assets/images/logo.png" type="image/png">
  <!-- Shared stylesheet across the CurioTech platform -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Site Header & Navigation -->
  <header class="site-header">
    <div class="container">
      <a href="dashboard.html" class="brand" aria-label="CurioTech Dashboard">
        <img src="assets/images/logo.png" alt="CurioTech logo" class="brand-logo">
        <span class="brand-name">Curio<span>Tech</span></span>
      </a>
      <nav class="site-nav" aria-label="Lesson header navigation">
        <a href="course.html" class="nav-link">← Course Overview</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="#quiz-anchor" class="nav-link">Quiz Check</a>
        <a href="index.html" class="nav-logout-btn">Logout</a>
      </nav>
    </div>
  </header>

  <!-- Main Lesson Content Area (Populated dynamically by js/course.js) -->
  <main>
    <div class="container">
      <div id="lesson-content-area" class="lesson-page-wrapper">
        <!-- Fallback loading message if JS is initializing -->
        <div style="text-align: center; padding: 4rem 1rem;">
          <p style="color: var(--color-lavender); font-size: 1.25rem;">Loading CurioTech Lesson...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <p class="footer-text">CurioTech — Learn by doing.</p>
    </div>
  </footer>

  <!-- Base scripts & Course engine -->
  <script src="js/main.js"></script>
  <script src="js/course.js"></script>
</body>

</html>
